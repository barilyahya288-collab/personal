<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Plus Jakarta Sans";
    src: url("file:///workspace/node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-600-normal.woff") format("woff");
    font-weight: 600;
    font-style: normal;
  }
  @font-face {
    font-family: "Plus Jakarta Sans";
    src: url("file:///workspace/node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-800-normal.woff") format("woff");
    font-weight: 800;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #f6f7f9;
  }
  .stage {
    width: 1200px;
    height: 630px;
    background: #f6f7f9;
    position: relative;
  }
  .pill {
    position: absolute;
    top: 48px;
    left: 64px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    height: 48px;
    padding: 0 18px 0 20px;
    border-radius: 999px;
    background: #ffffff;
    border: 1px solid #e6e8ee;
    box-shadow: 0 10px 30px rgb(23 25 31 / 0.06);
    font-family: "Plus Jakarta Sans", sans-serif;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: -0.03em;
    color: #17191f;
    line-height: 1;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: #22c55e;
    flex: none;
  }
  .lockup {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding-top: 24px;
  }
  h1 {
    font-family: "Plus Jakarta Sans", sans-serif;
    font-weight: 800;
    font-size: 148px;
    line-height: 0.9;
    letter-spacing: -0.045em;
    color: #17191f;
  }
  p {
    margin-top: 22px;
    font-family: "Plus Jakarta Sans", sans-serif;
    font-weight: 600;
    font-size: 32px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: #17191f;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="pill">PORTFOLIO.<span class="dot" aria-hidden="true"></span></div>
    <div class="lockup">
      <h1>Baril</h1>
      <p>Fullstack Web Developer</p>
    </div>
  </div>
</body>
</html>
